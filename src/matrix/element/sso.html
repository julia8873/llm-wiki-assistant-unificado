<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Iniciando sesión...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f4f6f8;
      color: #333;
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: #0ebd8c;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div style="text-align: center;">
    <div class="spinner"></div>
    <p>Conectando con la sala de chat...</p>
  </div>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const loginToken = params.get('loginToken');
      const room = params.get('room');
      const basePath = window.location.pathname.replace(/\/sso\.html$/, '');

      if (!loginToken) {
        window.location.replace(basePath + '/' + (room ? '#/room/' + encodeURIComponent(room) : ''));
        return;
      }

      // Obtener URL de Synapse desde config.json para garantizar compatibilidad con devceprud y local
      let hsUrl = '';
      try {
        const resp = await fetch('config.json');
        if (resp.ok) {
          const cfg = await resp.json();
          hsUrl = cfg?.default_server_config?.['m.homeserver']?.base_url || '';
        }
      } catch (e) {
        console.warn('No se pudo cargar config.json:', e);
      }

      if (!hsUrl) {
        hsUrl = window.location.origin;
      }

      // Element Web requiere mx_sso_hs_url en localStorage para procesar loginToken
      localStorage.setItem('mx_sso_hs_url', hsUrl);
      localStorage.setItem('mx_hs_url', hsUrl);

      // Redirigir a Element Web con loginToken y la sala de destino
      const target = basePath + '/?loginToken=' + encodeURIComponent(loginToken) + (room ? '#/room/' + encodeURIComponent(room) : '');
      window.location.replace(target);
    })();
  </script>
</body>
</html>
