# Configuration file for Synapse.
#
# This is a YAML file: see [1] for a quick introduction. Note in particular
# that *indentation is important*: all the elements of a list or dictionary
# should have the same indentation.
#
# [1] https://docs.ansible.com/ansible/latest/reference_appendices/YAMLSyntax.html
#
# For more information on how to configure Synapse, including a complete accounting of
# each option, go to docs/usage/configuration/config_documentation.md or
# https://element-hq.github.io/synapse/latest/usage/configuration/config_documentation.html
server_name: "localhost"
pid_file: /data/homeserver.pid

# Permitir a Element Web conectarse desde el navegador
cors_allowed_origins:
  - '*'
listeners:
  - port: 8008
    bind_addresses: ['0.0.0.0']
    resources:
    - compress: false
      names:
      - client
      - federation
    tls: false
    type: http
    x_forwarded: true
database:
  name: psycopg2
  allow_unsafe_locale: true
  args:
    user: "mapeo_user"
    password: "mapeo_db_pass"
    database: "mapeo_db"
    host: postgres
    cp_min: 5
    cp_max: 10
log_config: "/data/homeserver.log.config"
media_store_path: /data/media_store
registration_shared_secret: "CHANGEME"
report_stats: false
macaroon_secret_key: "CHANGEME"
form_secret: "CHANGEME"
signing_key_path: "/data/localhost.signing.key"
trusted_key_servers:
  - server_name: "matrix.org"

enable_registration: true
enable_registration_without_verification: true

password_providers:
  - module: "rest_auth_provider.RestAuthProvider"
    config:
      endpoint: "http://moodle:8080/blocks/bdc/api/auth.php"

# Aumentar límites para evitar M_LIMIT_EXCEEDED en logins locales
rc_login:
  address:
    per_second: 100
    burst_count: 500
  account:
    per_second: 100
    burst_count: 500
  failed_attempts:
    per_second: 100
    burst_count: 500

# vim:ft=yaml