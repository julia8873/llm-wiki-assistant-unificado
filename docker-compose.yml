services:
  mariadb:
    image: mariadb:10.11
    container_name: ${MARIADB_NOMBRE_CONTENEDOR}
    environment:
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  moodle:
    build:
      context: ./src/moodle
      dockerfile: Dockerfile
    container_name: ${MOODLE_NOMBRE_CONTENEDOR}
    ports:
      - "${MOODLE_PUERTO_HOST}:${MOODLE_PUERTO_CONTENEDOR}"
    environment:
      - BITNAMI_DEBUG=true
      - MOODLE_REVERSEPROXY=${MOODLE_REVERSEPROXY_ENABLED}
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=${MARIADB_USER}
      - MOODLE_DATABASE_PASSWORD=${MARIADB_PASSWORD}
      - MOODLE_DATABASE_NAME=${MARIADB_DATABASE}
      - MOODLE_USERNAME=${MOODLE_USERNAME}
      - MOODLE_PASSWORD=${MOODLE_PASSWORD}
      - MOODLE_EMAIL=${MOODLE_EMAIL}
      - MOODLE_SITE_NAME=LLM Wiki Assistant Moodle
      - MOODLE_HOST=${MOODLE_EXTERNAL_URL}
      - MAPEO_API_TOKEN=${MAPEO_API_TOKEN}
      - MAPEO_API_URL=http://mapeo-api:${MAPEO_API_PUERTO_CONTENEDOR}
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN}
      - SYNAPSE_URL=http://synapse:${SYNAPSE_PUERTO_CONTENEDOR}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
      - ./src/moodle/block_bdc:/moodle-custom-plugin
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    networks:
      - default
      - bdc-net

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: ${SYNAPSE_NOMBRE_CONTENEDOR}
    ports:
      - "${SYNAPSE_PUERTO_HOST}:${SYNAPSE_PUERTO_CONTENEDOR}"
    environment:
      - SYNAPSE_SERVER_NAME=${DOMAIN}
      - SYNAPSE_REPORT_STATS=no
      - PYTHONPATH=/data
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - SYNAPSE_CONFIG_ENABLE_ENV=yes
      - SYNAPSE_REGISTRATION_SECRET=${SYNAPSE_REGISTRATION_SECRET}
      - SYNAPSE_MACAROON_SECRET=${SYNAPSE_MACAROON_SECRET}
      - SYNAPSE_FORM_SECRET=${SYNAPSE_FORM_SECRET}
    volumes:
      - ./src/matrix/synapse-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  element:
    image: vectorim/element-web:latest
    container_name: ${ELEMENT_NOMBRE_CONTENEDOR}
    ports:
      - "${ELEMENT_PUERTO_HOST}:${ELEMENT_PUERTO_CONTENEDOR}"
    volumes:
      - ./src/matrix/element/config.json:/app/config.json:ro
      - ./src/matrix/element/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      synapse:
        condition: service_healthy

  mapeo-api:
    build:
      context: ./src/api
    image: moodle-matrix-dev-mapeo-api
    container_name: ${MAPEO_API_NOMBRE_CONTENEDOR}
    environment:
      - MAPEO_API_TOKEN=${MAPEO_API_TOKEN}
      - GITHUB_PAT=${GITHUB_PAT}
      - GITHUB_ORG=${GITHUB_ORG}
      - DATABASE_URL=${DATABASE_URL}
      - TEMPLATE_ID=${TEMPLATE_ID}
      - PYTHONPATH=/shared-pkg
      - PORT_MAPEO_API=${MAPEO_API_PUERTO_CONTENEDOR}
      - MAPEO_API_ROOT_PATH=${MAPEO_API_ROOT_PATH:-}
    volumes:
      - mapeo_api_data:/data
      - ./config:/config:ro
      - ./src/shared:/shared-pkg:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - bdc-net
    ports:
      - "${MAPEO_API_PUERTO_HOST}:${MAPEO_API_PUERTO_CONTENEDOR}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MAPEO_API_PUERTO_CONTENEDOR}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_NOMBRE_CONTENEDOR}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - default
      - bdc-net
    volumes:
      - postgres_api_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  maubot:
    build:
      context: ./src/bot
      dockerfile: Dockerfile
    container_name: ${MAUBOT_NOMBRE_CONTENEDOR}
    environment:
      - MAPEO_API_TOKEN=${MAPEO_API_TOKEN}
      - MAPEO_API_URL=http://mapeo-api:${MAPEO_API_PUERTO_CONTENEDOR}
      - GITHUB_PAT=${GITHUB_PAT}
      - GITHUB_ORG=${GITHUB_ORG}
      - TEMPLATE_ID=${TEMPLATE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PGVECTOR_USER=${PGVECTOR_USER}
      - PGVECTOR_PASSWORD=${PGVECTOR_PASSWORD}
      - PGVECTOR_DB=${PGVECTOR_DB}
      - PGVECTOR_HOST=pgvector
      - PYTHONPATH=/shared-pkg
    command: ["sh", "-c", "exec python -m maubot -c /data/config.yaml"]
    ports:
      - "${MAUBOT_PUERTO_HOST}:${MAUBOT_PUERTO_CONTENEDOR}"
    volumes:
      - ./src/bot:/data
      - ./config:/config:ro
      - ./src/shared:/shared-pkg:ro
    depends_on:
      synapse:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    networks:
      - default
      - bdc-net

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ${PGVECTOR_NOMBRE_CONTENEDOR}
    environment:
      POSTGRES_USER: ${PGVECTOR_USER}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: ${PGVECTOR_DB}
    ports:
      - "${PGVECTOR_PUERTO_HOST}:${PGVECTOR_PUERTO_CONTENEDOR}"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER} -d ${PGVECTOR_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ${LLM_SERVER_OPCIONAL_NOMBRE_CONTENEDOR}
    profiles:
      - ollama
    ports:
      - "${LLM_SERVER_OPCIONAL_PUERTO_HOST}:${LLM_SERVER_OPCIONAL_PUERTO_CONTENEDOR}"
    volumes:
      - ollama_data:/root/.ollama

  redis:
    image: redis:7
    container_name: ${REDIS_NOMBRE_CONTENEDOR}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - default
      - bdc-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sync-worker-1:
    build:
      context: ./src/bot
      dockerfile: Dockerfile
    container_name: ${SYNC_WORKER_1_NOMBRE_CONTENEDOR}
    working_dir: /data/llm-wiki-assistant-plugin
    command: ["rq", "worker", "sync-jobs", "log-jobs", "--url", "redis://redis:${REDIS_PUERTO_CONTENEDOR}"]
    environment:
      - MAPEO_API_TOKEN=${MAPEO_API_TOKEN}
      - GITHUB_PAT=${GITHUB_PAT}
      - GITHUB_ORG=${GITHUB_ORG}
      - TEMPLATE_ID=${TEMPLATE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - MAPEO_API_URL=http://mapeo-api:${MAPEO_API_PUERTO_CONTENEDOR}
      - METRICS_API_URL=http://metrics-api:${PORT_METRICS_API}
      - PYTHONPATH=/data/llm-wiki-assistant-plugin:/shared-pkg
    volumes:
      - ./src/bot:/data
      - ./config:/config:ro
      - ./src/shared:/shared-pkg:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - bdc-net

  sync-worker-2:
    build:
      context: ./src/bot
      dockerfile: Dockerfile
    container_name: ${SYNC_WORKER_2_NOMBRE_CONTENEDOR}
    working_dir: /data/llm-wiki-assistant-plugin
    command: ["rq", "worker", "sync-jobs", "log-jobs", "--url", "redis://redis:${REDIS_PUERTO_CONTENEDOR}"]
    environment:
      - MAPEO_API_TOKEN=${MAPEO_API_TOKEN}
      - GITHUB_PAT=${GITHUB_PAT}
      - GITHUB_ORG=${GITHUB_ORG}
      - TEMPLATE_ID=${TEMPLATE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - MAPEO_API_URL=http://mapeo-api:${MAPEO_API_PUERTO_CONTENEDOR}
      - METRICS_API_URL=http://metrics-api:${PORT_METRICS_API}
      - PYTHONPATH=/data/llm-wiki-assistant-plugin:/shared-pkg
    volumes:
      - ./src/bot:/data
      - ./config:/config:ro
      - ./src/shared:/shared-pkg:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - bdc-net

  backup:
    build:
      context: ./src/backup
    container_name: ${BACKUP_NOMBRE_CONTENEDOR}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - redis_data:/redis_data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "[c]rond"]
      interval: 30s
      timeout: 10s
      retries: 3

  metrics-api:
    image: moodle-matrix-dev-mapeo-api
    pull_policy: never
    depends_on:
      mapeo-api:
        condition: service_healthy
    container_name: ${METRICS_API_NOMBRE_CONTENEDOR}
    command: ["sh", "-c", "pip install -e . && alembic upgrade head && uvicorn metrics_api.main:app --host 0.0.0.0 --port ${PORT_METRICS_API} --proxy-headers --root-path \"${METRICS_API_ROOT_PATH:-}\""]
    volumes:
      - ./src/metrics-api:/app
      - ./config:/config
      - ./src/shared:/shared-pkg:ro
    working_dir: /app
    environment:
      - PYTHONPATH=/shared-pkg
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MAPEO_API_TOKEN=${MAPEO_API_TOKEN}
      - MOODLE_AUTH_URL=http://moodle:${MOODLE_PUERTO_CONTENEDOR}/login/token.php
      - MOODLE_HOST_HEADER=${DOMAIN}:${MOODLE_PUERTO_HOST}
      - MAPEO_API_URL=http://mapeo-api:${MAPEO_API_PUERTO_CONTENEDOR}
      - ENABLE_DEMO_AUTH=true
      - ENVIRONMENT=dev
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - PII_SECRET_KEY=${PII_SECRET_KEY}
      - GITHUB_TOKEN=${GITHUB_PAT}
      - GITHUB_TOKEN_AGENT=${GITHUB_PAT}
      - ENABLE_EVALUATION_AGENT=${ENABLE_EVALUATION_AGENT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  metrics-worker:
    image: moodle-matrix-dev-mapeo-api
    pull_policy: never
    depends_on:
      mapeo-api:
        condition: service_healthy
    container_name: ${METRICS_WORKER_NOMBRE_CONTENEDOR}
    command: ["sh", "-c", "export PYTHONPATH=/shared-pkg && pip install -e /metrics-api && pip install -e . && python -m metrics_worker.worker"]
    volumes:
      - ./src/metrics-worker:/app
      - ./src/metrics-api:/metrics-api
      - ./src/shared:/shared-pkg
    working_dir: /app
    environment:
      - MOCK_SERVICES=false
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - GITHUB_TOKEN=${GITHUB_PAT}
      - MAPEO_API_URL=http://mapeo-api:${MAPEO_API_PUERTO_CONTENEDOR}
      - MAPEO_API_TOKEN=${MAPEO_API_TOKEN}

  frontend:
    image: node:20-alpine
    container_name: ${FRONTEND_NOMBRE_CONTENEDOR}
    command: ["sh", "-c", "npm install && npm run dev"]
    volumes:
      - ./src/frontend:/app
    working_dir: /app
    ports:
      - "${FRONTEND_PUERTO_HOST}:${FRONTEND_PUERTO_CONTENEDOR}"

volumes:
  mariadb_data:
  moodle_data:
  moodledata_data:
  ollama_data:
  mapeo_api_data:
  postgres_api_data:
  pgvector_data:
  redis_data:

networks:
  bdc-net:
